ón remolcador con las sierras chicas al fondo.", "Pista.jpg": "Vista aérea de la Pista: El Grob G-103 sobrevolando la pista. Se visualiza su cabecera 02 y las instaciones del Aeroclub Alta Gracia y de Los Caranchos.", "Maquinas_en_Plataforma.jpg": "Máquinas en Plataforma: El conjunto de planeadores de Los Caranchos junto a los dos aviones remolcadores.", "Ka6.jpg": "Volando sobre la llanura: Al este y sur del aeródromo cada campo es una pista de aterrizaje. La punta de ala señala al Ka-6 virando.", "Grob2.jpg": "Planeador Biplaza Grob G-103 Acro: Totalmente acrobático, usado para instrucción avanzada de pilotos.", "Aterrizando.jpg": "Planeador aterrizando: En la cabecera 02, el planeador ASW-20. Al fondo las sierras chicas de Córdoba.", "Anizacate.jpg": "Remolque sobre el río Anizacate: En ocasión de una visita de la Escuela de Aviación Militar a Los Caranchos (Foto: Cap. Marcelo Buteler).", "Pirat.jpg": "Planeador Pirat de la Escuela de Aviación Militar: Volando en Los Caranchos (Foto: Cap. Marcelo Buteler)", "Twin.jpg": "Planeador Grob de la Escuela de Aviación Militar: Volando en instrucción sobre Alta Gracia (Foto: Cap. Marcelo Buteler).", "Tocho.jpg": "Planeador Grob de la Escuela de Aviación Militar: Al comando del Vcom. Rodolfo \"Tocho\" Hub, en el puesto trasero, durante un vuelo de instrucción de un cadete en la Escuela de Aviación Militar.", "69.jpg": "El Cirrus 69: Sentado Hugo Vicario, y parados de izq. a der. Ricardo Gudiño, Luis Rossi y Claudio Venturini.", "GrobyK13.jpg": "Primer vuelo: De una sobrina de Luis Rossi realizado por Hugo Vicario. Atrás se encuentran Arturo Meroff y Marcos Ríos. También se ve el otro biplaza (K-13).", "Quintana.jpg": "Dique José de la Quintana: Sobre el arroyo Los Molinos. Atrás hacia el oeste se ve el Dique Los Molinos, y por detrás el cordón de las Sierras Grandes.", "Cerro_Negro.jpg": "Cerro Negro: Esta foto nos muestra su cara Oeste, y sobre la raíz del ala se puede visualizar parte del Dique de la Viña.", "Dique.jpg": vero.jpg": "Río Mina Clavero: En esta foto se aprecia su nacimiento y como se desplaza hacia el valle de traslasierra, siendo sorteado por el camino de las Altas Cumbres.", "La_Cumbrecita.jpg": "La Cumbrecita: Al final del camino, en el centro, se visualiza una pequeña localidad entre los pinos y las sierras. Colonia alemana con arquitectura alpina.", "Los_Molinos2.jpg": "Dique Los Molinos: Al sur de Alta Gracia. Lugar de asiento de varios clubes de pescadores.", "Los_Molinos.jpg": "Dique Los Molinos: Vista aérea más cercana.", "Alegre.jpg": "Observatorio Bosque Alegre:", "Alegre2.jpg": "Observatorio Bosque Alegre: Vista desde el sur.", "Estacion.jpg": "Estación terrena Bosque Alegre:", "Casa_de_Tulio.jpg": "Casa de Tulio Calderón: Señalada por la punta del ala. Se obserba una pequeña pista que corta en X el camino de ingreso a la casa.", "Tulio.jpg": "Casa de Tulio Calderón (2):", "Carlos_Paz_y_lago_San_Roque.jpg": "Villa Carlos Paz y lago San Roque: Vista desde el sur de la villa serrana de mayor interés turístico de la Provincia de Córdoba.", "Carlos_Paz_y_lago_San_Roque2.jpg": "Villa Carlos Paz y lago San Roque: Vista desde el sureste y sobre las sierras chicas.", "La_Falda.jpg": "La Falda y el camino del Cuadrado: Desde el este se ve como desciende el camino del cuadrado hacia la localidad de La Falda del valle de Punilla.", "La_Cumbre.jpg": "La Cumbre: Volando sobre las sierras, de norte a sur, a la derecha se aprecia en primer lugar a La Cumbre y más a lo lejos La Falda. Ambas localidades del valle de Punilla. (No me cargen por la lanita).", "Ovni_Uritorco.jpg": "Ovni detrás del Uritorco: La flecha señala el círculo que se atribuyó a un ovni, y que dió tanto renombre al Cerro Uritorco.", "Caja_en_la_Pista.jpg": "Caja en la pista: Así se denomina el ordenado de los planeadores que esperan el turno para despegar.", "Crepusculo.jpg": "Crepúsculo: El CA (ASW-20) con el fondo de las nubes y los cerros en el crepúsculo de la Cordillera de Los Andes (Foto: Tato Verdura).", "Nubes_de_Onda.jpg": "Nubes de Onda: Este día Justin Wills (Nueva Zelanda) con Mauricio Delfabro en el Janus tomaron 8.500 metros en onda (Foto: Tato Verdura)", "Entre_quebradas.jpg": "Entre quebradas: Foto tomada por Thierry Fraize desde el Cirrus 2.", "Quebrada_del_Tunuyan.jpg": "Quebrada del Tunuyán: Con nubes sobre el Cerro Redondo.", "Condores.jpg": "Cóndores: El ala los señala volando en las laderas.", "libelle.jpg": "Volviendo al atardecer: El Libelle 92 piloteado por Luis Mazzaglia (Foto de Arturo Ferreyra).", "CA_en_las_nubes.jpg": "CA (ASW-20) en las nubes: Fotografía obtenida por Arturo Ferreyra.", "Rayos.jpg": "Rayos de sol: En la cordillera.", "El_CS_entre_los_cerros.jpg": "El CS (DG-400) entre los cerros: Al mando de Carlos Schmitt (Foto de Arturo Ferreyra).", "Pasada_del_KY.jpg": "Pasada del KY (Cirrus): Al comando de Arturo Ferreyra.", "Manzano_Historico.jpg": "Manzano Histórico: Lugar donde descansó San Martín durante su cruce de la cordillera de Los Andes.", "2yThierry.jpg": "El 2 (Cirrus) y el Tupungato: Al comando de Thierry Fraize, al fondo y a la derecha se ve el Cerro Tupungato.", "Base_del_Tupungato.jpg": "Base del Tupungato: Se obserba su cara sureste. La cumbre del cerro (6.800 metros s.n.m.) está oculta por las nubes.", "Pista_de_esqui_Vallecitos.jpg": "Pista de esquí Vallecitos: Situada a unos 90 kilómetros de La Consulta.", "Un_Cirrus_en_Los_Andes.jpg": "Un Cirrus (KY) en Los Andes: Foto de Arturo Ferreyra.", "Pasada_del_CA.jpg": "Pasada de un ASW-20 (CA): Al comando de José Otero (Foto de Arturo Ferreyra).", "Pista_en_el_desierto.jpg": "Pista en el desierto: Asfaltada y de 2.000 metros de longitud. Al fondo se ve el salar de Pipanaco y la cara oeste de la sierra de Ambato.", "Nevado_del_Candado.jpg": "Nevado del Candado (5.450 metros s.n.m.): Forma parte de la Sierra del Aconquija que separa la provincia de Catamarca de la de Tucumán.", "Ciudad.jpg": "Ciudad de Andalgalá: En la base del Nevado del Candado.", "Virando.jpg": "Virando en las faldas del cerro Ambato:", "Desierto.jpg": "Desierto del Salar de Pipanaco: La flecha señala la cresta nevada del cerro Famatina de la Provincia de La Rioja, en el extremo sur de este desierto.", "Chicos_en_plataforma.jpg": "Chicos en plataforma: Mis hijos Lucía, José Ignacio y Pilar Otero en la plataforma. Al fondo el cerro Nevado del Candado.", "Mi_Familia.jpg": "Mi Familia: Mi mujer Ana, mis hijos Lucía, José Ignacio (h) y Pilar, y yo. Detrás el Jantar del C.P.Catamarca.", "Familia2001.jpg": "Mi familia versión 2001: Mi mujer Ana, mis hijos Lucía, José Ignacio (h) y Pilar, y yo en el Campeonato Nacional de Tres Arroyos.", "Familia2002.jpg": "Mi familia versión 2002: Mi mujer Ana, mis hijos Lucía, José Ignacio (h) y Pilar, y yo (Foto: Susana Goddio de Sanchez)"};
